<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今彩 539 - 自選立柱損益與回測分析</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f4f4f2; padding: 12px; color: #333; margin: 0; }
        .container { max-width: 1600px; margin: 0 auto; background: white; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { text-align: center; color: #333; font-size: 1.4em; margin: 10px 0 15px 0; }
        .nav-bar { text-align: center; margin-bottom: 15px; }
        .nav-bar a { display: inline-block; padding: 8px 16px; background: #64748b; color: white; text-decoration: none; border-radius: 6px; font-size: 0.85em; font-weight: bold; }
        
        /* 獨立成本試算計算機 */
        .calc-panel { background: #0f172a; color: #f8fafc; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .calc-panel h3 { margin: 0 0 12px 0; color: #38bdf8; font-size: 1em; display: flex; align-items: center; gap: 8px; }
        .calc-grid { display: flex; flex-direction: column; gap: 12px; }
        .pillar-inputs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; }
        .pillar-input-box { display: flex; flex-direction: column; align-items: center; background: #1e293b; padding: 6px 8px; border-radius: 6px; border: 1px solid #334155; }
        .pillar-input-box label { font-size: 0.7em; color: #94a3b8; margin-bottom: 2px; }
        .pillar-input-box input { width: 42px; padding: 4px 0; text-align: center; font-size: 1em; font-weight: bold; background: #0f172a; border: 1px solid #475569; color: #38bdf8; border-radius: 4px; }
        
        .calc-result-boxes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .res-box { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; text-align: center; flex: 1 1 80px; min-width: 75px; }
        .res-box .res-label { font-size: 0.7em; color: #94a3b8; margin-bottom: 2px; }
        .res-box .res-val { font-size: 1em; font-weight: bold; color: #f8fafc; }
        .res-cost { border-color: #38bdf8; background: #0369a1; }
        .res-cost .res-val { color: #fff; }

        /* 篩選與參數設定面板 */
        .filter-panel { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 0.88em; }
        .filter-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
        .filter-title { font-weight: bold; color: #1e293b; font-size: 0.9em; }
        .checkbox-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
        .checkbox-item { cursor: pointer; display: flex; align-items: center; gap: 3px; font-weight: 600; }
        
        .param-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .param-item { display: flex; align-items: center; gap: 4px; font-weight: 600; }
        .param-input { width: 50px; padding: 3px; text-align: center; font-size: 0.95em; font-weight: bold; border: 1px solid #94a3b8; border-radius: 4px; }

        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 20px; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; text-align: center; }
        .card .title { font-size: 0.75em; color: #64748b; margin-bottom: 4px; }
        .card .val { font-size: 1.05em; font-weight: bold; }
        .profit-pos { color: #dc2626; }
        .profit-neg { color: #16a34a; }
        
        /* 核心響應式容器：解決手機端欄位壓迫問題 */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; border: 1px solid #cbd5e1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82em; min-width: 1100px; }
        th { background: #1e293b; color: #fff; padding: 8px 4px; border: 1px solid #334155; white-space: nowrap; }
        td { padding: 6px 4px; border: 1px solid #e2e8f0; text-align: center; font-weight: bold; vertical-align: middle; }
        
        /* 柱位內號碼標籤化：保證足夠邊距且不破版 */
        .pillar-chips { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; min-width: 120px; }
        .chip { display: inline-block; padding: 1px 5px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.88em; font-family: monospace; }
        .chip-hit { background: #fee2e2 !important; border-color: #f87171 !important; color: #dc2626 !important; font-weight: 900; }

        .ball { display: inline-block; width: 20px; height: 20px; line-height: 20px; background: #b8978e; color: white; border-radius: 50%; font-size: 0.75em; margin: 1px; }
        .predict-row { background-color: #fffbeb !important; }
        .hit-cell { background-color: #fef2f2; }
        .col-disabled { background-color: #f1f5f9 !important; color: #94a3b8 !important; text-decoration: line-through; }
    </style>
</head>
<body>
    <div class="container">
        <h1>自選立柱損益與回測計算機</h1>
        <div class="nav-bar">
            <a href="index.html">⬅ 返回主分析儀表板</a>
        </div>

        <!-- 獨立立柱成本計算機 -->
        <div class="calc-panel">
            <h3>🧮 立柱碰數與成本即時試算機</h3>
            <div class="calc-grid">
                <div class="pillar-inputs">
                    <div class="pillar-input-box"><label>柱1</label><input type="number" id="calc-c1" value="6" min="0" max="39"></div>
                    <div class="pillar-input-box"><label>柱2</label><input type="number" id="calc-c2" value="6" min="0" max="39"></div>
                    <div class="pillar-input-box"><label>柱3</label><input type="number" id="calc-c3" value="6" min="0" max="39"></div>
                    <div class="pillar-input-box"><label>柱4</label><input type="number" id="calc-c4" value="6" min="0" max="39"></div>
                    <div class="pillar-input-box"><label>柱5</label><input type="number" id="calc-c5" value="6" min="0" max="39"></div>
                </div>
                
                <div class="calc-result-boxes">
                    <div class="res-box"><div class="res-label">二星碰數</div><div class="res-val" id="calc-p2">0</div></div>
                    <div class="res-box"><div class="res-label">三星碰數</div><div class="res-val" id="calc-p3">0</div></div>
                    <div class="res-box"><div class="res-label">四星碰數</div><div class="res-val" id="calc-p4">0</div></div>
                    <div class="res-box"><div class="res-label">總注數</div><div class="res-val" id="calc-total-bets" style="color: #facc15;">0</div></div>
                    <div class="res-box res-cost"><div class="res-label" style="color: #e0f2fe;">總成本</div><div class="res-val" id="calc-total-cost">0 元</div></div>
                </div>
            </div>
        </div>

        <!-- 參數與位置控制面板 -->
        <div class="filter-panel">
            <div class="filter-row">
                <span class="filter-title">📌 選擇回測位置：</span>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" class="col-toggle" value="0" checked> 位01</label>
                    <label class="checkbox-item"><input type="checkbox" class="col-toggle" value="1" checked> 位02</label>
                    <label class="checkbox-item"><input type="checkbox" class="col-toggle" value="2" checked> 位03</label>
                    <label class="checkbox-item"><input type="checkbox" class="col-toggle" value="3" checked> 位04</label>
                    <label class="checkbox-item"><input type="checkbox" class="col-toggle" value="4" checked> 位05</label>
                </div>
            </div>
            
            <div class="filter-row">
                <span class="filter-title">✂️ 精簡過濾：</span>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" id="trim-head"> 剔除每柱最小號</label>
                    <label class="checkbox-item"><input type="checkbox" id="trim-tail"> 剔除每柱最大號</label>
                </div>
            </div>

            <div class="filter-row">
                <span class="filter-title">⚙️ 加權口數：</span>
                <div class="param-group">
                    <label class="param-item">2星: <input type="number" id="mult-2" class="param-input" value="6.0" min="0" step="0.1"> 口</label>
                    <label class="param-item">3星: <input type="number" id="mult-3" class="param-input" value="1.0" min="0" step="0.1"> 口</label>
                    <label class="param-item">4星: <input type="number" id="mult-4" class="param-input" value="1.0" min="0" step="0.1"> 口</label>
                </div>
            </div>
        </div>

        <div class="summary-cards">
            <div class="card"><div class="title">單注成本 / 當前配置</div><div class="val" id="config-summary" style="font-size: 0.85em;">75 元</div></div>
            <div class="card"><div class="title">參與立柱</div><div class="val" id="active-pillars-count">5 柱</div></div>
            <div class="card"><div class="title">總成本</div><div class="val" id="sum-cost">0 元</div></div>
            <div class="card"><div class="title">總獎金</div><div class="val" id="sum-prize">0 元</div></div>
            <div class="card"><div class="title">累積淨損益</div><div class="val" id="sum-profit">0 元</div></div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 55px;">期別</th>
                        <th style="width: 120px;">當期獎號</th>
                        <th>第1柱 (位01)</th>
                        <th>第2柱 (位02)</th>
                        <th>第3柱 (位03)</th>
                        <th>第4柱 (位04)</th>
                        <th>第5柱 (位05)</th>
                        <th style="width: 65px;">命中</th>
                        <th style="width: 85px;">基礎碰數</th>
                        <th style="width: 75px;">加權注數</th>
                        <th style="width: 75px;">當期成本</th>
                        <th style="width: 85px;">中獎碰數</th>
                        <th style="width: 80px;">當期獎金</th>
                        <th style="width: 80px;">淨損益</th>
                    </tr>
                </thead>
                <tbody id="tbody-result"></tbody>
            </table>
        </div>
    </div>

    <script>
        const COST_PER_BET = 75;
        const PRIZE_2 = 5300;
        const PRIZE_3 = 57000;
        const PRIZE_4 = 750000;

        let globalData = null;
        const pad = (n) => n.toString().padStart(2, '0');

        async function init() {
            try {
                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`calc-c${i}`).addEventListener('input', updateStandaloneCalculator);
                }

                const res = await fetch('./data.json?t=' + new Date().getTime());
                globalData = await res.json();
                
                document.querySelectorAll('.col-toggle').forEach(el => {
                    el.addEventListener('change', () => runSimulation(globalData));
                });

                document.getElementById('trim-head').addEventListener('change', () => runSimulation(globalData));
                document.getElementById('trim-tail').addEventListener('change', () => runSimulation(globalData));

                ['mult-2', 'mult-3', 'mult-4'].forEach(id => {
                    document.getElementById(id).addEventListener('input', () => {
                        updateStandaloneCalculator();
                        runSimulation(globalData);
                    });
                });

                updateStandaloneCalculator();
                runSimulation(globalData);
            } catch (e) {
                console.error("資料載入失敗:", e);
            }
        }

        function updateStandaloneCalculator() {
            const counts = [];
            for (let i = 1; i <= 5; i++) {
                counts.push(Math.max(0, parseInt(document.getElementById(`calc-c${i}`).value) || 0));
            }

            const mult2 = Math.max(0, Math.round((parseFloat(document.getElementById('mult-2').value) || 0) * 10) / 10);
            const mult3 = Math.max(0, Math.round((parseFloat(document.getElementById('mult-3').value) || 0) * 10) / 10);
            const mult4 = Math.max(0, Math.round((parseFloat(document.getElementById('mult-4').value) || 0) * 10) / 10);

            const p2Comb = getPillarCombinations(counts, 2);
            const p3Comb = getPillarCombinations(counts, 3);
            const p4Comb = getPillarCombinations(counts, 4);

            const totalBets = (p2Comb * mult2) + (p3Comb * mult3) + (p4Comb * mult4);
            const totalCost = Math.round(totalBets * COST_PER_BET);

            document.getElementById('calc-p2').textContent = p2Comb.toLocaleString();
            document.getElementById('calc-p3').textContent = p3Comb.toLocaleString();
            document.getElementById('calc-p4').textContent = p4Comb.toLocaleString();
            document.getElementById('calc-total-bets').textContent = totalBets.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 1});
            document.getElementById('calc-total-cost').textContent = totalCost.toLocaleString() + ' 元';
        }

        function calculateMatrix(data, type) {
            const matrix = [];
            for (let i = 0; i < data.length; i++) {
                let d = [];
                if (i > 0) {
                    const prev = data[i-1].nums.map(Number);
                    const curr = data[i].nums.map(Number);
                    if (type === 1) { 
                        for(let c=0; c<5; c++) d.push(curr.map(n => Math.abs(n - prev[c]))); 
                    } else { 
                        const t = prev.map(n => n % 10); 
                        for(let c=0; c<5; c++) { 
                            let s=0; for(let k=0; k<=c; k++) s+=t[k]; 
                            d.push(curr.map(n => Math.abs(n - s))); 
                        } 
                    }
                } else { for(let c=0; c<5; c++) d.push(null); }
                matrix.push(d);
            }
            return matrix;
        }

        function getPredictions(data, matrix1, matrix2) {
            const total = data.length;
            const preds = {};
            for (let offset = 20; offset >= 0; offset--) {
                const targetIdx = total - offset;
                if (targetIdx >= total && offset !== 0) continue;
                const isFuture = (offset === 0);
                const periodKey = isFuture ? "NEXT" : data[targetIdx].period;
                const rawCols = [];

                for (let c = 0; c < 5; c++) {
                    const getModeHot = (matrix, type) => {
                        const start = Math.max(1, (isFuture ? total : targetIdx) - 20);
                        const end = isFuture ? total : targetIdx;
                        const counts = {};
                        for (let i = start; i < end; i++) {
                            matrix[i][c].forEach(v => {
                                if (matrix.slice(start, i).some(m => m[c] && m[c].includes(v))) {
                                    counts[v] = (counts[v] || 0) + 1;
                                }
                            });
                        }
                        const hot = Object.keys(counts).sort((a,b) => counts[b] - counts[a]).slice(0, 2).map(Number);
                        let base = 0;
                        const refIdx = (isFuture ? total : targetIdx) - 1;
                        if (type === 1) base = data[refIdx].nums.map(Number)[c];
                        else {
                            const t = data[refIdx].nums.map(n => Number(n)%10);
                            for (let k = 0; k <= c; k++) base += t[k];
                        }
                        const p = [];
                        hot.forEach(d => { [base+d, Math.abs(base-d)].forEach(n => { if (n >= 1 && n <= 39) p.push(n); }); });
                        return p;
                    };
                    const p1 = getModeHot(matrix1, 1);
                    const p2 = getModeHot(matrix2, 2);
                    rawCols.push([...new Set([...p1, ...p2])].sort((a,b) => a - b));
                }

                // 優先順序去重：[1, 0, 2, 3, 4]
                const priorityOrder = [1, 0, 2, 3, 4];
                const seenNumbers = new Set();
                const dedupCols = [[], [], [], [], []];

                for (const colIdx of priorityOrder) {
                    const filtered = [];
                    for (const num of rawCols[colIdx]) {
                        if (!seenNumbers.has(num)) {
                            seenNumbers.add(num);
                            filtered.push(num);
                        }
                    }
                    dedupCols[colIdx] = filtered;
                }

                preds[periodKey] = dedupCols;
            }
            return preds;
        }

        function getPillarCombinations(counts, k) {
            const len = counts.length;
            if (len < k) return 0;
            let total = 0;
            function backtrack(start, depth, currentProduct) {
                if (depth === k) { total += currentProduct; return; }
                for (let i = start; i < len; i++) {
                    backtrack(i + 1, depth + 1, currentProduct * counts[i]);
                }
            }
            backtrack(0, 0, 1);
            return total;
        }

        const comb = (n, r) => {
            if (n < r) return 0;
            let p = 1;
            for (let i = 0; i < r; i++) p = p * (n - i) / (i + 1);
            return p;
        };

        function runSimulation(data) {
            const mult2 = Math.max(0, Math.round((parseFloat(document.getElementById('mult-2').value) || 0) * 10) / 10);
            const mult3 = Math.max(0, Math.round((parseFloat(document.getElementById('mult-3').value) || 0) * 10) / 10);
            const mult4 = Math.max(0, Math.round((parseFloat(document.getElementById('mult-4').value) || 0) * 10) / 10);
            
            document.getElementById('config-summary').textContent = `75元 (2星×${mult2}, 3星×${mult3}, 4星×${mult4})`;

            const checkedCols = Array.from(document.querySelectorAll('.col-toggle:checked')).map(el => parseInt(el.value));
            document.getElementById('active-pillars-count').textContent = `${checkedCols.length} 柱`;

            const trimHead = document.getElementById('trim-head').checked;
            const trimTail = document.getElementById('trim-tail').checked;

            const m1 = calculateMatrix(data, 1);
            const m2 = calculateMatrix(data, 2);
            const preds = getPredictions(data, m1, m2);

            const total = data.length;
            const tbody = document.getElementById('tbody-result');
            tbody.innerHTML = '';

            let grandCost = 0;
            let grandPrize = 0;

            for (let offset = 20; offset >= 0; offset--) {
                const targetIdx = total - offset;
                const isFuture = (offset === 0);
                if (!isFuture && targetIdx >= total) continue;

                const period = isFuture ? "NEXT" : data[targetIdx].period;
                const actual = isFuture ? [] : data[targetIdx].nums.map(Number);
                const rawPeriodCols = preds[period];

                const allCols = rawPeriodCols.map(col => {
                    let sorted = [...col].sort((a, b) => a - b);
                    if (trimHead && sorted.length > 0) sorted.shift();
                    if (trimTail && sorted.length > 0) sorted.pop();
                    return sorted;
                });

                const activeCols = checkedCols.map(idx => allCols[idx]);
                const activeColCounts = activeCols.map(c => c.length);

                const p2Comb = getPillarCombinations(activeColCounts, 2);
                const p3Comb = getPillarCombinations(activeColCounts, 3);
                const p4Comb = getPillarCombinations(activeColCounts, 4);

                const totalBets = (p2Comb * mult2) + (p3Comb * mult3) + (p4Comb * mult4);
                const cost = Math.round(totalBets * COST_PER_BET);

                let hitPillars = 0;
                activeCols.forEach(col => {
                    const hits = col.filter(n => !isFuture && actual.includes(n));
                    if (hits.length > 0) hitPillars++;
                });

                let win2 = 0, win3 = 0, win4 = 0, prize = 0, profit = 0;
                if (!isFuture) {
                    win2 = comb(hitPillars, 2);
                    win3 = comb(hitPillars, 3);
                    win4 = comb(hitPillars, 4);

                    prize = Math.round((win2 * mult2 * PRIZE_2) + (win3 * mult3 * PRIZE_3) + (win4 * mult4 * PRIZE_4));
                    profit = prize - cost;

                    grandCost += cost;
                    grandPrize += prize;
                }

                const tr = document.createElement('tr');
                if (isFuture) tr.className = 'predict-row';

                let colsHtml = '';
                for (let c = 0; c < 5; c++) {
                    const isChecked = checkedCols.includes(c);
                    const colNums = allCols[c];
                    
                    if (!isChecked) {
                        colsHtml += `<td class="col-disabled">未選取</td>`;
                        continue;
                    }

                    const hits = colNums.filter(n => !isFuture && actual.includes(n));
                    let chipsHtml = '';
                    if (colNums.length > 0) {
                        chipsHtml = `<div class="pillar-chips">` + 
                            colNums.map(n => {
                                const isHit = !isFuture && actual.includes(n);
                                return `<span class="chip ${isHit ? 'chip-hit' : ''}">${pad(n)}</span>`;
                            }).join('') + `</div>`;
                    } else {
                        chipsHtml = `<span style="color:#94a3b8;">空柱</span>`;
                    }
                    
                    colsHtml += `<td class="${(!isFuture && hits.length > 0) ? 'hit-cell' : ''}">${chipsHtml}</td>`;
                }

                const profitClass = profit >= 0 ? 'profit-pos' : 'profit-neg';
                const profitText = isFuture ? '---' : `${profit >= 0 ? '+' : ''}${profit.toLocaleString()} 元`;

                tr.innerHTML = `
                    <td>${period}</td>
                    <td>${isFuture ? '待開獎' : data[targetIdx].nums.map(n => `<span class="ball">${pad(n)}</span>`).join('')}</td>
                    ${colsHtml}
                    <td>${isFuture ? '---' : hitPillars + ' 柱'}</td>
                    <td style="font-size:0.9em;">${p2Comb}/${p3Comb}/${p4Comb}</td>
                    <td>${totalBets.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 1})}</td>
                    <td>${cost.toLocaleString()}</td>
                    <td style="font-size:0.9em;">${isFuture ? '---' : `${win2}/${win3}/${win4}`}</td>
                    <td>${isFuture ? '---' : prize.toLocaleString()}</td>
                    <td class="${profitClass}">${profitText}</td>
                `;
                tbody.appendChild(tr);
            }

            const netProfit = grandPrize - grandCost;
            document.getElementById('sum-cost').textContent = grandCost.toLocaleString() + ' 元';
            document.getElementById('sum-prize').textContent = grandPrize.toLocaleString() + ' 元';
            const sumProfitEl = document.getElementById('sum-profit');
            sumProfitEl.textContent = `${netProfit >= 0 ? '+' : ''}${netProfit.toLocaleString()} 元`;
            sumProfitEl.className = `val ${netProfit >= 0 ? 'profit-pos' : 'profit-neg'}`;
        }

        init();
    </script>
</body>
</html>
